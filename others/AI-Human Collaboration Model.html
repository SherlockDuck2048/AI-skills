  * { box-sizing:border-box; margin:0; padding:0; }

  .panel-right { left:1340px; border:1.5px solid rgba(192,132,252,0.6); box-shadow:0 22px 55px rgba(0,0,0,0.45), 0 0 34px rgba(168,85,247,0.22), inset 0 0 24px rgba(168,85,247,0.06); }

  .h-arrow.r::after { content:&quot;&quot;; position:absolute; right:-1px; top:50%; transform:translateY(-50%); border-top:7px solid transparent; border-bottom:7px solid transparent; border-left:11px solid #22d3ee; filter:drop-shadow(0 0 6px #22d3ee); }

  .b-card {
    flex:1; border-radius:14px; padding:18px 22px; display:flex; align-items:center; gap:18px; text-align:left;
    background:rgba(8,14,34,0.55); border:1.5px solid rgba(34,211,238,0.5);

  .b-card h3 { font-size:21px; font-weight:700; letter-spacing:1.5px; margin-bottom:6px; }

  .b-card.ai h3 { color:#e9d5ff; text-shadow:0 0 12px rgba(192,132,252,0.5); }

  .b-card p { font-size:16.5px; font-weight:500; color:#e2e8f0; line-height:1.45; }

<script>
(() => {
  const stage = document.getElementById('stage');

  const frame = stage.firstElementChild;
  const fit = () => {
    const scale = document.documentElement.clientWidth / 1920;

    stage.style.height = (1296 * scale) + 'px';
    frame.style.transform = 'translate(' + (0 * scale) + 'px,' + (0 * scale) + 'px) scale(' + (1 * scale) + ')';
  };

  new ResizeObserver(fit).observe(document.documentElement);
  addEventListener('resize', fit);
  fit();
})();
</script></body></html>
